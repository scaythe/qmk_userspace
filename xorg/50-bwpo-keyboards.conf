# Sets the xkb option fkeys:basic_13-24 for the Preonic rev3 and the ID75, so
# that their F13 to F24 keys stay function keys. MatchUSBID lists the USB IDs
# that the firmware of these keyboards sends, as set in their definition in QMK.
# The option applies to these keyboards only, because X receives the microphone
# and touchpad keys of other keyboards as F20 to F23.
#
# To install this file, copy it to /etc/X11/xorg.conf.d/ and restart X.

Section "InputClass"
    Identifier "bwpo keyboards"
    MatchIsKeyboard "on"
    MatchUSBID "03a8:a649|594d:0075"
    Option "XkbOptions" "fkeys:basic_13-24"
EndSection
